name: Release
on:
  workflow_dispatch:
env:
  node_version: 22.23.2
jobs:
  release:
    outputs:
      release_version: ${{ steps.package_version.outputs.version }}
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.node_version }}
          cache: npm
      - name: Read package version
        id: package_version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT
      - run: npm ci
      - name: Install UPX
        uses: crazy-max/ghaction-upx@v3
        with:
          install-only: true
      - name: Build Windows release with AWA-Manager tray app
        run: npm run build
      - name: Verify Windows tray artifacts
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'output/AWA-Manager.exe')) {
            throw 'output/AWA-Manager.exe was not built'
          }
          $archiveEntries = tar -tf AWA-Helper-Win.tar.gz
          if ($archiveEntries -notcontains './output/AWA-Manager.exe') {
            throw 'AWA-Manager.exe is missing from AWA-Helper-Win.tar.gz'
          }
      - run: node scripts/md5.js
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: false
          tag_name: v${{ steps.package_version.outputs.version }}
          name: ${{ steps.package_version.outputs.version }}
          body_path: CHANGELOG.txt
          files: |
            AWA-Helper-Win.tar.gz
            output/index.js
            output/sha256.txt
          token: ${{ github.TOKEN }}
  release-linux:
    needs: release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.node_version }}
          cache: npm
      - name: Install UPX
        uses: crazy-max/ghaction-upx@v3
        with:
          install-only: true
      - run: npm ci
      - run: npm run build:pre
      - name: build-x64
        run: |
          node --experimental-sea-config AWA-Helper-config.json
          curl --fail --location --retry 3 https://nodejs.org/dist/v${{ env.node_version }}/node-v${{ env.node_version }}-linux-x64.tar.xz -o node-linux-x64.tar.xz
          tar -xvf node-linux-x64.tar.xz node-v${{ env.node_version }}-linux-x64/bin/node
          cp node-v${{ env.node_version }}-linux-x64/bin/node output/AWA-Helper
          npx postject output/AWA-Helper NODE_SEA_BLOB AWA-Helper.blob --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
          # upx --brute ./output/AWA-Helper
          tar --exclude index.js --exclude *.bat -zcvf AWA-Helper-Linux-x64.tar.gz ./output
          rm -rf output/AWA-Helper
      - name: build-armv7
        run: |
          curl --fail --location --retry 3 https://nodejs.org/dist/v${{ env.node_version }}/node-v${{ env.node_version }}-linux-armv7l.tar.xz -o node-linux-armv7l.tar.xz
          tar -xvf node-linux-armv7l.tar.xz node-v${{ env.node_version }}-linux-armv7l/bin/node
          cp node-v${{ env.node_version }}-linux-armv7l/bin/node output/AWA-Helper
          npx postject output/AWA-Helper NODE_SEA_BLOB AWA-Helper.blob --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
          # upx --brute ./output/AWA-Helper
          tar --exclude index.js --exclude *.bat -zcvf AWA-Helper-Linux-armv7.tar.gz ./output
          rm -rf output/AWA-Helper
      - name: build-armv8
        run: |
          curl --fail --location --retry 3 https://nodejs.org/dist/v${{ env.node_version }}/node-v${{ env.node_version }}-linux-arm64.tar.xz -o node-linux-arm64.tar.xz
          tar -xvf node-linux-arm64.tar.xz node-v${{ env.node_version }}-linux-arm64/bin/node
          cp node-v${{ env.node_version }}-linux-arm64/bin/node output/AWA-Helper
          npx postject output/AWA-Helper NODE_SEA_BLOB AWA-Helper.blob --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
          # upx --brute ./output/AWA-Helper
          tar --exclude index.js --exclude *.bat -zcvf AWA-Helper-Linux-armv8.tar.gz ./output
          rm -rf output/AWA-Helper
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: false
          tag_name: v${{ needs.release.outputs.release_version }}
          name: ${{ needs.release.outputs.release_version }}
          body_path: CHANGELOG.txt
          files: |
            AWA-Helper-Linux-x64.tar.gz
            AWA-Helper-Linux-armv7.tar.gz
            AWA-Helper-Linux-armv8.tar.gz
          token: ${{ github.TOKEN }}
