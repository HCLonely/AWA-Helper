name: Test
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  release:
    permissions:
      contents: read
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci
      - name: Verify
        run: npm run verify
      - name: Compile Windows tray app
        run: node scripts/build-tray.js
      - name: Verify Windows tray executable
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'output/AWA-Manager.exe')) {
            throw 'output/AWA-Manager.exe was not built'
          }
      - name: Run Test
        shell: pwsh
        run: ./test.ps1
