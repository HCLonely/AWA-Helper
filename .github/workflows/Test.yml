name: Test
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  verify:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: [22.20.0]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Check installer syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $bytes = [IO.File]::ReadAllBytes((Join-Path $PWD 'install.ps1'))
          if ([BitConverter]::ToString($bytes, 0, 3) -ne 'EF-BB-BF') { throw 'install.ps1 needs a UTF-8 BOM for Windows PowerShell 5.1' }
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'install.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
      - name: Check Linux installer syntax
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash -n install.sh
          sh install.sh --help
          bash install.sh --help
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck install.sh
          fi
      - name: Verify
        run: npm run verify
      - name: Compile Windows tray app
        if: runner.os == 'Windows'
        run: node scripts/build-tray.js
      - name: Test Windows installer and recovery
        if: runner.os == 'Windows'
        run: node scripts/test-tray.js
      - name: Verify Windows tray executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'output/AWA-Manager.exe')) {
            throw 'output/AWA-Manager.exe was not built'
          }
      - name: Run Test
        shell: pwsh
        run: ./test.ps1
